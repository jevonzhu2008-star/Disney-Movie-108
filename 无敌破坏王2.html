<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无敌破坏王2</title>
<style>
/* ======== CSS 变量与全局重置 ======== */
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2129;
  --border: #21262d; --border2: #30363d;
  --accent: #f0883e; --accent-glow: rgba(240,136,62,0.15);
  --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
  --green: #3fb950; --red: #f85149; --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ======== 容器 ======== */
.container { max-width: 900px; margin: 0 auto; padding: 0 16px 48px; }

/* ======== 顶部导航栏（悬浮毛玻璃） ======== */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(13,17,23,0.82); backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px; margin: 0 -16px;
  display: flex; align-items: center; gap: 14px;
}
.topbar h1 {
  font-size: 17px; font-weight: 800; color: var(--text);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: 0.02em;
}
.topbar .back-btn {
  font-size: 13px; color: var(--text2); text-decoration: none;
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.03); transition: all .2s;
  white-space: nowrap; font-weight: 500;
}
.topbar .back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--border2); }

/* ======== 播放器卡片（悬浮毛玻璃） ======== */
.player-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  margin: 16px 0 20px;
  box-shadow: 0 4px 32px rgba(0,0,0,0.4);
  position: sticky; top: 56px; z-index: 100;
  transition: box-shadow .3s;
}
.player-card:focus-within {
  box-shadow: 0 4px 32px rgba(0,0,0,0.5), 0 0 0 2px var(--accent-glow);
}
/* 自定义音频控件包装 */
.audio-wrap { margin-bottom: 14px; }
.audio-wrap audio { width: 100%; display: block; border-radius: 8px; height: 40px; }
/* 覆盖浏览器原生 audio 控件在深色模式下的样式 */
audio::-webkit-media-controls-panel { background-color: var(--surface2); }
audio::-webkit-media-controls-current-time-display,
audio::-webkit-media-controls-time-remaining-display { color: var(--text); }

/* 当前台词卡片 */
.current-line-card {
  background: linear-gradient(135deg, rgba(240,136,62,0.06), rgba(240,136,62,0.02));
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 14px 18px; margin: 12px 0;
  min-height: 72px; display: flex; align-items: center;
  text-align: left; transition: all .3s ease;
}
.current-line-zh { color: var(--text); font-size: 17px; font-weight: 700; line-height: 1.7; letter-spacing: 0.02em; }
.current-line-en { color: var(--text2); font-size: 14px; margin-top: 5px; line-height: 1.6; }
.current-line-placeholder { color: var(--text3); font-size: 13px; font-style: italic; }

/* 进度条（自定义） */
.progress-row {
  display: flex; align-items: center; gap: 10px; margin: 10px 0;
}
.progress-row span {
  font-size: 12px; color: var(--text2); font-family: var(--font-mono);
  min-width: 40px; text-align: center;
}
.progress-row input[type="range"] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 5px; border-radius: 3px; background: var(--border);
  outline: none; cursor: pointer;
}
.progress-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg);
  box-shadow: 0 0 8px var(--accent-glow);
  cursor: pointer; transition: transform .12s;
}
.progress-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

/* 控制按钮组 */
.controls-row {
  display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0;
}
.controls-row button {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 7px 15px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all .18s ease; font-family: var(--font);
  display: flex; align-items: center; gap: 2px;
}
.controls-row button:hover { background: var(--border2); color: var(--text); border-color: var(--text3); }
.controls-row button:active { transform: scale(0.95); }
.controls-row button.skip-btn { border-color: rgba(240,136,62,0.4); color: var(--accent); }
.controls-row button.skip-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls-row button .arrow { font-size: 16px; line-height: 1; }

/* 偏移滑条 */
.offset-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  font-size: 12px; color: var(--text2);
}
.offset-row input[type="range"] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
}
.offset-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--text2); border: 2px solid var(--bg); cursor: pointer;
}
.offset-row .mini-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 3px 10px; border-radius: 5px;
  cursor: pointer; font-size: 11px; font-weight: 500; transition: all .15s;
}
.offset-row .mini-btn:hover { background: var(--border2); color: var(--text); }

/* ======== 试看 Banner ======== */
.trial-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: linear-gradient(135deg, rgba(240,136,62,0.12), rgba(240,136,62,0.04));
  border: 1px solid rgba(240,136,62,0.25); border-radius: 12px;
  padding: 12px 18px; margin: 14px 0;
  backdrop-filter: blur(8px);
}
.trial-banner .trial-info { display: flex; flex-direction: column; gap: 2px; }
.trial-banner .trial-title { font-size: 14px; font-weight: 700; color: var(--accent); }
.trial-banner .trial-desc { font-size: 12px; color: var(--text2); }
.trial-banner .unlock-btn {
  background: linear-gradient(135deg, var(--accent), #e07b2c);
  color: #fff; border: none; padding: 9px 22px; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 700;
  transition: all .2s; white-space: nowrap; letter-spacing: 0.03em;
  box-shadow: 0 4px 16px rgba(240,136,62,0.25);
}
.trial-banner .unlock-btn:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(240,136,62,0.35); }
.trial-banner .unlock-btn:active { transform: scale(0.96); }

/* ======== 搜索框 ======== */
.search-box {
  width: 100%; padding: 11px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; font-family: var(--font);
  transition: all .25s; outline: none; margin: 8px 0 4px;
}
.search-box::placeholder { color: var(--text3); }
.search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ======== 字幕表格 ======== */
.subs-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.subs-table col.time { width: 52px; }
.subs-table col.idx { width: 36px; }
.subs-table col.zh { width: 42%; }
.subs-table col.en { width: 46%; }

.subs-table tr {
  cursor: pointer; transition: all .22s ease;
  user-select: none; -webkit-user-select: none;
  border-radius: 6px;
}
.subs-table tr:hover { background: rgba(255,255,255,0.025); }
.subs-table tr.active {
  background: linear-gradient(90deg, rgba(240,136,62,0.1), rgba(240,136,62,0.03));
  box-shadow: inset 3px 0 0 var(--accent);
}
.subs-table tr.active td { color: var(--text); }
.subs-table tr.active .zh-col { font-weight: 700; }
.subs-table tr.locked td { color: var(--text3) !important; opacity: 0.45; }
.subs-table tr.locked:hover { background: transparent; cursor: default; }

.subs-table td {
  padding: 9px 10px; border-bottom: 1px solid rgba(48,54,61,0.3);
  vertical-align: top; font-size: 14px; line-height: 1.75;
  letter-spacing: 0.01em;
}
.subs-table tr:last-child td { border-bottom: none; }
.subs-table .time-col {
  text-align: right; color: var(--text3); font-size: 11px;
  font-family: var(--font-mono); white-space: nowrap; padding-right: 4px;
  letter-spacing: 0.04em;
}
.subs-table .idx-col {
  text-align: right; color: var(--text3); font-size: 10px;
  font-family: var(--font-mono); padding-right: 4px;
  opacity: 0.5;
}
.subs-table .zh-col { color: var(--text); word-break: break-word; }
.subs-table .en-col { color: var(--text2); word-break: break-word; }
.subs-table .zh-col.hidden, .subs-table .en-col.hidden { display: none; }
.subs-table .time-col.hidden, .subs-table .idx-col.hidden { display: none; }
/* 列切换按钮 */
.toggle-row {
  display: flex; gap: 6px; margin: 8px 0; font-size: 12px;
}
.toggle-row .toggle-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 4px 12px; border-radius: 6px;
  cursor: pointer; transition: all .15s; font-size: 12px;
  user-select: none; -webkit-user-select: none;
}
.toggle-row .toggle-btn:hover { background: var(--border2); color: var(--text); }
.toggle-row .toggle-btn.off { opacity: 0.4; background: transparent; }

/* ======== 付费墙分隔线 ======== */
.paywall-divider {
  text-align: center; padding: 24px 0; margin: 12px 0;
  border-top: 1px dashed var(--border2); border-bottom: 1px dashed var(--border2);
  background: linear-gradient(180deg, rgba(240,136,62,0.04), rgba(240,136,62,0.01));
  border-radius: 10px; cursor: pointer; transition: all .3s ease;
}
.paywall-divider:hover {
  border-color: var(--accent); background: rgba(240,136,62,0.08);
  border-style: solid;
}
.paywall-divider .lock-icon { font-size: 28px; margin-bottom: 6px; }
.paywall-divider .paywall-text { color: var(--accent); font-size: 15px; font-weight: 600; }

/* 快捷键提示 */
.shortcuts-hint {
  text-align: center; margin-top: 16px; font-size: 11px; color: var(--text3);
  letter-spacing: 0.04em;
}
.shortcuts-hint kbd {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 6px; font-family: var(--font-mono);
  font-size: 10px; color: var(--text2); margin: 0 1px;
}

/* ======== 付费弹窗 ======== */
.modal-overlay {
  display: none; position: fixed; z-index: 9999;
  inset: 0; background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 20px; border: 1px solid var(--border2);
  padding: 32px 28px; max-width: 400px; width: 92%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  text-align: center; position: relative;
  animation: modalIn .35s cubic-bezier(.4,0,.2,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-close {
  position: absolute; top: 14px; right: 18px;
  background: none; border: none; color: var(--text3);
  font-size: 24px; cursor: pointer; transition: color .15s;
  line-height: 1; padding: 4px;
}
.modal-close:hover { color: var(--text); }
.modal-box h2 { color: var(--accent); font-size: 21px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.02em; }
.modal-box .sub { color: var(--text2); font-size: 13px; margin-bottom: 16px; }
.modal-box .price {
  color: var(--accent); font-size: 36px; font-weight: 800; margin: 4px 0 12px;
  letter-spacing: -0.02em;
}
.modal-box .price small { font-size: 18px; font-weight: 600; }
.qr-wrap {
  width: 180px; height: 180px; margin: 0 auto 8px;
  background: #fff; border-radius: 14px; padding: 6px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.qr-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
.modal-box .hint { font-size: 12px; color: var(--text2); margin: 8px 0 6px; line-height: 1.7; }
.modal-box .hint strong { color: var(--accent); }
.contact-row {
  display: flex; gap: 8px; margin: 10px 0;
  font-size: 12px; color: var(--text2); justify-content: center; align-items: center;
}
.contact-row .wx-copy {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--accent); padding: 5px 14px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s;
  font-family: var(--font-mono);
}
.contact-row .wx-copy:hover { background: var(--border2); }
.contact-row .wx-copy.copied { color: var(--green); border-color: var(--green); }
.unlock-input-row { display: flex; gap: 8px; margin: 10px 0; }
.unlock-input-row input {
  flex: 1; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--border2); background: var(--bg); color: var(--text);
  font-size: 16px; text-align: center; letter-spacing: 6px;
  font-family: var(--font-mono); outline: none; transition: border-color .2s;
}
.unlock-input-row input:focus { border-color: var(--accent); }
.unlock-input-row input::placeholder { letter-spacing: 0; color: var(--text3); }
.unlock-input-row button {
  background: linear-gradient(135deg, var(--accent), #e07b2c);
  color: #fff; border: none; padding: 12px 22px; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 700; white-space: nowrap;
  transition: all .2s; letter-spacing: 0.03em;
  box-shadow: 0 4px 16px rgba(240,136,62,0.25);
}
.unlock-input-row button:hover { filter: brightness(1.15); }
.unlock-input-row button:active { transform: scale(0.95); }
.unlock-input-row button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.unlock-result { font-size: 13px; margin-top: 8px; min-height: 20px; font-weight: 600; }
.unlock-result.success { color: var(--green); }
.unlock-result.error { color: var(--red); }

/* ======== 响应式 ======== */
@media (max-width: 640px) {
  .container { padding: 0 10px 32px; }
  .topbar { margin: 0 -10px; padding: 10px 12px; }
  .topbar h1 { font-size: 15px; }
  .player-card { padding: 14px 12px; margin: 10px 0 14px; }
  .subs-table td { font-size: 13px; padding: 7px 6px; }
  .subs-table col.idx { width: 0; }
  .subs-table .idx-col { display: none; }
  .subs-table col.time { width: 42px; }
  .subs-table col.zh { width: 44%; }
  .subs-table col.en { width: 50%; }
  .modal-box { padding: 24px 18px; }
  .controls-row button { padding: 6px 11px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="topbar">
  <h1>无敌破坏王2</h1>
  <a href="index.html" class="back-btn">← 返回</a>
</div>
<div class="container">

  <!-- 播放器卡片 -->
  <div class="player-card">

</div>

<!-- 付费弹窗 -->
<div class="modal-overlay" id="payModal">

<script>
// ======== 配置 ========
const MOVIE_ID = 23;
const XOR_KEY = "disney-movie-108";
const MASTER_SECRET = "d1sney-m0v!e-p4yw4ll-s3cr3t-k3y-2024";

function decodeTimeline(encoded) {
  const raw = atob(encoded);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) {
    bytes[i] = raw.charCodeAt(i) ^ XOR_KEY.charCodeAt(i % XOR_KEY.length);
  }
  return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}

const FULL_TIMELINE = decodeTimeline(TIMELINE_ENCODED);

// ======== 解锁状态 ========
let unlocked = false;

async function checkUnlock() {
  // 先检查是否为会员（movieId=0 的 HMAC）
  const memberCode = localStorage.getItem("membership");
  if (memberCode && await verifyLicense(0, memberCode)) {
    unlocked = true;
    return;
  }
  const savedCode = localStorage.getItem("unlock_" + MOVIE_ID);
  if (savedCode) {
    unlocked = await verifyLicense(MOVIE_ID, savedCode);
    if (!unlocked) localStorage.removeItem("unlock_" + MOVIE_ID);
  }
}

async function verifyLicense(movieId, code) {
  try {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
      "raw", enc.encode(MASTER_SECRET),
      { name: "HMAC", hash: "SHA-256" },
      false, ["sign"]
    );
    const sig = await crypto.subtle.sign("HMAC", key, enc.encode(String(movieId)));
    const expected = Array.from(new Uint8Array(sig))
      .map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 10);
    return code === expected;
  } catch {
    return false;
  }
}

function getVisibleTimeline() {
  return unlocked ? FULL_TIMELINE : FULL_TIMELINE.slice(0, FREE_LIMIT);
}

let TIMELINE = getVisibleTimeline();

// ======== DOM 引用 ========
const audio = document.getElementById("audio");
const table = document.getElementById("subsTable");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const progressBar = document.getElementById("progressBar");
const lineDisplay = document.getElementById("lineDisplay");

let currentIdx = 0;
let activeRow = null;
let timeOffset = parseFloat(localStorage.getItem("zoo_offset") || "0");
document.getElementById("offsetSlider").value = timeOffset;
document.getElementById("offsetVal").textContent = timeOffset.toFixed(1) + "s";

function updateOffset(v) {
  timeOffset = parseFloat(v);
  document.getElementById("offsetVal").textContent = timeOffset.toFixed(1) + "s";
  localStorage.setItem("zoo_offset", String(timeOffset));
  const tl = unlocked ? FULL_TIMELINE : TIMELINE;
  table.querySelectorAll(".time-col").forEach((td, i) => {
    if (i < tl.length) td.textContent = fmt(tl[i].t + timeOffset);
  });
}
function resetOffset() {
  document.getElementById("offsetSlider").value = 0;
  updateOffset(0);
}

function fmt(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function render(filter) {
  const source = unlocked ? FULL_TIMELINE : TIMELINE;
  let show = filter
    ? source.filter(line =>
        line.zh.includes(filter) || line.en.toLowerCase().includes(filter.toLowerCase())
      )
    : source;
  let html = "";
  for (const line of show) {
    const cls = line.idx === currentIdx ? " active" : "";
    const t = fmt(line.t);
    html += '<tr class="subtr' + cls + '" data-idx="' + line.idx + '" onclick="jump(' + line.idx + ')">'
      + '<td class="time-col">' + t + '</td>'
      + '<td class="idx-col">' + line.idx + '</td>'
      + '<td class="zh-col">' + line.zh + '</td>'
      + '<td class="en-col">' + line.en + '</td>'
      + '</tr>';
  }

  if (!unlocked && FULL_TIMELINE.length > FREE_LIMIT) {
    html += '<tr><td colspan="4"><div class="paywall-divider" onclick="showModal()">'
      + '<div class="lock-icon">🔒</div>'
      + '<div class="paywall-text">剩余 ' + (FULL_TIMELINE.length - FREE_LIMIT) + ' 句已锁定 · 点击解锁完整台词</div>'
      + '</div></td></tr>';
  }

  table.innerHTML = html;
  activeRow = table.querySelector(".subtr.active");
  scrollToActive();
}

function scrollToActive() {
  if (!activeRow) return;
  requestAnimationFrame(() => {
    const rect = activeRow.getBoundingClientRect();
    if (rect.bottom > window.innerHeight - 90 || rect.top < 200) {
      activeRow.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  });
}

function updateCurrent(playTime) {
  if (playTime == null || playTime < 0) return;
  const source = unlocked ? FULL_TIMELINE : TIMELINE;
  if (!source.length) return;
  let lo = 0, hi = source.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (((source[mid].t ?? Infinity) + timeOffset) <= playTime) lo = mid;
    else hi = mid - 1;
  }
  const idx = source[lo].idx;
  if (idx !== currentIdx) {
    currentIdx = idx;
    table.querySelectorAll(".subtr.active").forEach(el => el.classList.remove("active"));
    activeRow = table.querySelector('.subtr[data-idx="' + idx + '"]');
    if (activeRow) activeRow.classList.add("active");
    scrollToActive();
    const line = source[lo];
    lineDisplay.innerHTML = line.en
      ? '<div class="current-line-zh">' + line.zh + '</div><div class="current-line-en">' + line.en + '</div>'
      : '<div class="current-line-zh">' + line.zh + '</div>';
  }
}

function jump(idx) {
  const source = unlocked ? FULL_TIMELINE : TIMELINE;
  const line = source.find(l => l.idx === idx);
  if (!line || line.t == null) return;
  audio.currentTime = line.t + timeOffset;
  audio.play().catch(() => {});
}

function seek(dt) {
  const newTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + dt));
  audio.currentTime = newTime;
  progressBar.value = (audio.duration > 0) ? (newTime / audio.duration * 100) : 0;
}

function seekToPercent(pct) {
  if (audio.duration > 0) audio.currentTime = pct / 100 * audio.duration;
}

function filterLines() {
  render(document.getElementById("search").value.trim() || null);
}

// 列显示/隐藏切换（状态存 localStorage）
let colHidden = {};
try { colHidden = JSON.parse(localStorage.getItem("colHidden") || "{}"); } catch(e) {}
function applyColState() {
  document.querySelectorAll(".toggle-btn").forEach(btn => {
    const col = btn.dataset.col;
    if (colHidden[col]) { btn.classList.add("off"); btn.textContent = btn.textContent.replace("✓ ", ""); }
    else { btn.classList.remove("off"); }
  });
  document.querySelectorAll(".subs-table .time-col, .subs-table .idx-col").forEach(td => {
    td.classList.toggle("hidden", !!colHidden.time);
  });
  document.querySelectorAll(".subs-table .zh-col").forEach(td => {
    td.classList.toggle("hidden", !!colHidden.zh);
  });
  document.querySelectorAll(".subs-table .en-col").forEach(td => {
    td.classList.toggle("hidden", !!colHidden.en);
  });
}
function toggleCol(col, btn) {
  colHidden[col] = !colHidden[col];
  localStorage.setItem("colHidden", JSON.stringify(colHidden));
  applyColState();
}
// render 之后重新应用列状态
const _origRender = render;
render = function(filter) {
  _origRender(filter);
  applyColState();
};

function prevLine() {
  let idx = currentIdx - 1;
  if (idx < 1) idx = 1;
  jump(idx);
}
function nextLine() {
  const source = unlocked ? FULL_TIMELINE : TIMELINE;
  let idx = currentIdx + 1;
  const maxIdx = source.length > 0 ? source[source.length - 1].idx : 0;
  if (idx > maxIdx) return;
  jump(idx);
}

// ======== 事件监听 ========
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  currentTimeEl.textContent = fmt(t);
  if (audio.duration > 0) progressBar.value = (t / audio.duration * 100);
  updateCurrent(t);
});

audio.addEventListener("loadedmetadata", () => {
  durationEl.textContent = fmt(audio.duration);
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  switch (e.key) {
    case "ArrowLeft": seek(-5); e.preventDefault(); break;
    case "ArrowRight": seek(5); e.preventDefault(); break;
    case "ArrowUp": prevLine(); e.preventDefault(); break;
    case "ArrowDown": nextLine(); e.preventDefault(); break;
    case " ": e.preventDefault(); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); break;
  }
});

// 点击弹窗遮罩关闭
document.getElementById("payModal").addEventListener("click", function(e) {
  if (e.target === this) hideModal();
});

// ======== 付费弹窗 ========
function showModal() {
  document.getElementById("payModal").classList.add("show");
  document.getElementById("unlockInput").value = "";
  document.getElementById("unlockResult").textContent = "";
  document.getElementById("unlockResult").className = "unlock-result";
}
function hideModal() {
  document.getElementById("payModal").classList.remove("show");
}

function copyWx(btn) {
  navigator.clipboard.writeText("DoctorJevon").then(() => {
    btn.textContent = "已复制";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "复制微信号"; btn.classList.remove("copied"); }, 2000);
  }).catch(() => {
    btn.textContent = "请手动复制";
  });
}

async function doUnlock() {
  const code = document.getElementById("unlockInput").value.trim();
  const btn = document.getElementById("unlockBtn");
  const resultEl = document.getElementById("unlockResult");
  if (!code || code.length !== 10) {
    resultEl.className = "unlock-result error";
    resultEl.textContent = "请输入 10 位解锁码";
    return;
  }
  btn.disabled = true;
  btn.textContent = "验证中…";
  try {
    // 先试会员码 (id=0)
    let ok = await verifyLicense(0, code);
    if (ok) {
      localStorage.setItem("membership", code);
      unlocked = true;
    } else {
      ok = await verifyLicense(MOVIE_ID, code);
      if (ok) {
        localStorage.setItem("unlock_" + MOVIE_ID, code);
        unlocked = true;
      }
    }
    if (ok) {
      TIMELINE = FULL_TIMELINE;
      resultEl.className = "unlock-result success";
      resultEl.textContent = "解锁成功！正在刷新…";
      document.getElementById("trialBanner").style.display = "none";
      setTimeout(() => {
        hideModal();
        render(null);
        if (!audio.paused) updateCurrent(audio.currentTime);
      }, 600);
    } else {
      resultEl.className = "unlock-result error";
      resultEl.textContent = "解锁码无效，请核对后重试";
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "验证解锁";
  }
}

// ======== 初始化 ========
(async function init() {
  // 疯狂动物城 (#1) 永久免费样片
  if (MOVIE_ID === 1) {
    unlocked = true;
    localStorage.setItem("unlock_1", "__SAMPLE__");
  } else {
    await checkUnlock();
  }
  TIMELINE = getVisibleTimeline();
  if (!unlocked && FULL_TIMELINE.length > FREE_LIMIT) {
    document.getElementById("trialBanner").style.display = "flex";
  }
  render(null);
})();
</script>
