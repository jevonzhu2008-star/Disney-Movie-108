<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>疯狂动物城 — 动画台词学习</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: radial-gradient(circle at 30% 20%, #2c1654 0%, #1a1a2e 60%, #0a0a1f 100%);
  color: #eee; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.movie-card {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 32px;
  max-width: 880px; width: 100%;
  background: rgba(22, 33, 62, 0.6);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.cover-link {
  display: block; aspect-ratio: 2/3;
  border-radius: 12px; overflow: hidden;
  background: #0f3460;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.cover-link:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 16px 48px rgba(233, 69, 96, 0.4); }
.cover-link::after {
  content: "▶";
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; color: #fff;
  background: rgba(0,0,0,0.45);
  opacity: 0; transition: opacity .2s;
}
.cover-link:hover::after { opacity: 1; }
.cover-link img, .cover-link svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.info h1 {
  font-size: 36px; font-weight: 700; color: #fff;
  margin-bottom: 4px; line-height: 1.15;
}
.info .en-title {
  font-size: 18px; color: #e94560; font-weight: 500;
  margin-bottom: 14px; letter-spacing: 1px;
}
.info .meta-row {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-bottom: 18px; font-size: 13px; color: #aaa;
}
.info .meta-row span {
  background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 12px;
}
.info .desc {
  color: #cdd; font-size: 14px; line-height: 1.75;
  margin-bottom: 22px;
}
.info .play-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #e94560, #f08080);
  color: #fff; padding: 12px 28px; border-radius: 30px;
  text-decoration: none; font-size: 15px; font-weight: 600;
  width: fit-content;
  box-shadow: 0 4px 16px rgba(233, 69, 96, 0.4);
  transition: all .2s;
}
.info .play-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6); }
@media (max-width: 720px) {
  .movie-card { grid-template-columns: 1fr; padding: 20px; gap: 20px; text-align: center; }
  .cover-link { max-width: 240px; margin: 0 auto; }
  .info { align-items: center; }
  .info h1 { font-size: 28px; }
  .info .meta-row { justify-content: center; }
}
footer {
  position: fixed; bottom: 12px; left: 0; right: 0;
  text-align: center; font-size: 11px; color: #555;
}
</style>
</head>
